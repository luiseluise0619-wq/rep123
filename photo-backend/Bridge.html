<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="referrer" content="no-referrer"></head><body>
<script id="initial" type="application/json"><?!= initialJson ?></script><script>
'use strict';
const init=JSON.parse(document.getElementById('initial').textContent),origin='https://rep123-seven.vercel.app';
const allowed=new Set(['getPublicStatus','beginPublicCapture','uploadPublicPhoto','getPublicPhoto','deletePhoto','getPublicUploadReceipt']);
const channel=init.channel;
function send(value){window.top.postMessage({...value,channel},origin);}
window.addEventListener('message',event=>{
  if(event.origin!==origin||event.source!==window.top||!event.data||event.data.channel!==channel)return;
  const {id,name,args}=event.data;
  if(!/^[a-f0-9]{24}$/.test(String(id))||!allowed.has(name)||!Array.isArray(args)||JSON.stringify(args).length>400000)return;
  google.script.run.withSuccessHandler(result=>send({type:'reply',id,result}))
    .withFailureHandler(()=>send({type:'reply',id,result:{ok:false,code:'CONNECTION',message:'저장 서버 응답을 받지 못했습니다. 등록 현황을 확인해 주세요.'}}))[name](...args);
});
let legacyKey='';try{legacyKey=localStorage.getItem('photoDeviceKeyV4')||'';}catch(ignored){}
if(/^[a-f0-9]{64}$/.test(channel))send({type:'ready',legacyKey:/^[a-f0-9]{64}$/.test(legacyKey)?legacyKey:'',version:init.version});
</script></body></html>
