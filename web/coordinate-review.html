<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>주소·좌표 확인 내역</title><style>
:root{font:14px/1.6 system-ui,'Malgun Gothic',sans-serif;color:#111827;background:#fff}*{box-sizing:border-box}main{max-width:1200px;margin:auto;padding:24px 16px}a{color:#2563eb}h1{font-size:24px;margin:12px 0}p{color:#606975}.filters{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}input,select{padding:10px;border:1px solid #d1d5db;border-radius:8px;font:inherit}input{flex:1;min-width:220px}.table{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:12px;border-bottom:1px solid #e5e7eb;text-align:left;vertical-align:top}th{background:#f5f6f8;white-space:nowrap}td:first-child{min-width:260px}td:nth-child(3){min-width:220px}.warn{color:#b42318;font-weight:600}.ok{color:#2563eb}.note{font-size:12px;color:#606975;margin-top:5px}.status{min-width:140px}button{font:inherit;background:#2563eb;color:white;border:0;border-radius:8px;padding:10px 14px;cursor:pointer}
</style></head><body><main><a href="./">‹ 지도</a><h1>주소·좌표 확인 내역</h1><p id="summary">확인 내역을 불러오는 중…</p><p>지도 검색에서 원주소와 다른 번지가 나온 경우 그 좌표로 바꾸지 않았습니다. 동 이름만 있거나 위치를 특정할 수 없는 주소는 기존 근사 좌표와 경고를 유지합니다. 대조 완료도 층·호수의 위치나 실제 방문을 보증하지 않습니다.</p><div class="filters"><input id="query" type="search" placeholder="원주소 또는 검색 결과 검색" aria-label="주소 검색"><select id="filter" aria-label="확인 상태"><option value="remaining">확인 필요</option><option value="address-mismatch">주소 불일치</option><option value="insufficient-address">번지·건물 정보 없음</option><option value="unverified">위치 미확인</option><option value="verified">대조 완료</option><option value="all">전체</option></select><button id="export" type="button">CSV 내려받기</button></div><p id="count"></p><div class="table"><table><thead><tr><th>원주소</th><th>마커 표시</th><th>지도 검색 결과</th><th>확인 내용</th><th>지도</th></tr></thead><tbody id="rows"></tbody></table></div></main><script src="./coordinate-review.js?v=20261016-followup35"></script><script>
'use strict';
const data=window.COORD_REVIEW||{},records=Object.entries(data.records||{}),labels={'address-mismatch':'원주소와 지도 검색 결과 불일치','insufficient-address':'번지·건물 정보 없음',unverified:'정확한 위치 미확인','representative-only':'단지 대표 위치 · 개별 동 미확인',verified:'건물·지번 위치 대조 완료'},$=id=>document.getElementById(id);
const summary=data.summary||{};$('summary').textContent=(data.asOf||'')+' · 검토 '+(summary.checked||0)+'곳 · 대조 완료 '+(summary.verified||0)+'곳 · 확인 필요 '+(summary.remaining||0)+'곳';
if(data.followUp){const p=document.createElement('p'),a=document.createElement('a');p.textContent='이번 재확인 35곳: 건물·지번 좌표 확정 5곳, 단지 대표 좌표만 확인 2곳, 미확정 28곳. 단지 대표점 2곳도 확인 필요에 포함됩니다. ';a.href='./coordinate-followup.json';a.textContent='35곳 확인 근거';p.append(a);$('summary').after(p);for(const[value,label]of [['followup','이번 재확인 35곳'],['representative-only',labels['representative-only']]]){const option=document.createElement('option');option.value=value;option.textContent=label;$('filter').append(option);}}
function filtered(){const query=$('query').value.trim(),filter=$('filter').value;return records.filter(([address,r])=>(filter==='all'||filter==='remaining'&&r.status!=='verified'||filter==='followup'&&r.followUp||r.status===filter)&&(!query||(address+' '+r.matchedAddress).includes(query)));}
function safeSource(url){try{const u=new URL(url);return u.protocol==='https:'&&['map.kakao.com','place.map.kakao.com','map.naver.com','www.google.com'].includes(u.hostname)?u.href:null;}catch{return null;}}
function render(){const rows=filtered();$('rows').replaceChildren();$('count').textContent=rows.length+'개 주소';rows.forEach(([address,r])=>{const tr=document.createElement('tr');[address,labels[r.status]||'위치 미확인',r.matchedAddress||'단일 위치 미확인',r.note].forEach((value,i)=>{const td=document.createElement('td');td.textContent=value;if(i===1)td.className='status '+(r.status==='verified'?'ok':'warn');tr.append(td);});const td=document.createElement('td'),sources=[{title:'네이버 원주소 검색',url:'https://map.naver.com/p/search/'+encodeURIComponent(address.replace(/^전남광주통합특별시 /,'전라남도 '))},{title:'카카오 원주소 검색',url:'https://map.kakao.com/?q='+encodeURIComponent(address.replace(/^전남광주통합특별시 /,'전라남도 '))},{title:'확인한 지도 결과',url:r.sourceUrl}];sources.forEach(s=>{const url=safeSource(s.url);if(!url)return;const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener noreferrer';a.textContent=s.title;td.append(a,document.createElement('br'));});tr.append(td);$('rows').append(tr);});}
function csv(value){return '"'+String(value||'').replace(/^[=+@-]/,"'$&").replace(/"/g,'""')+'"';}
$('query').oninput=$('filter').onchange=render;$('export').onclick=()=>{const values=[['원주소','확인 상태','지도 검색 결과','확인 내용'],...filtered().map(([a,r])=>[a,labels[r.status],r.matchedAddress,r.note])];const url=URL.createObjectURL(new Blob(['\uFEFF'+values.map(r=>r.map(csv).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='주소_좌표_확인내역.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};render();
</script></body></html>
