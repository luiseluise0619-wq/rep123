<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<title>MYBOX 직접 업로드 점검</title>
<style>
body{font:16px/1.5 system-ui,'Malgun Gothic',sans-serif;color:#18212d;background:#f5f6f8;margin:0}
main{max-width:520px;margin:48px auto;padding:24px;background:#fff;border-radius:14px}
h1{font-size:23px;margin:0 0 10px}p{color:#4b5563}label{display:block;margin:18px 0 8px;font-weight:600}
input{width:100%;box-sizing:border-box;padding:12px;font:inherit;border:1px solid #9ca3af;border-radius:8px}
button{background:#2563eb;color:#fff;border:0;border-radius:8px;padding:12px 18px;font:inherit;margin-top:14px;cursor:pointer}
button:disabled{opacity:.55}#cleanup,#cleanupBatch{background:#4b5563}#result{white-space:pre-wrap;background:#f5f6f8;padding:14px;border-radius:8px;margin-top:20px}
</style>
</head>
<body><main>
<h1>MYBOX 직접 업로드 점검</h1>
<p>현장 사진이 아닌 작은 테스트 이미지를 MYBOX 별도 점검 폴더에 올립니다. 주소별 사진 수에는 포함되지 않습니다. 점검 후 MYBOX 휴지통으로 이동합니다.</p>
<label for="key">점검 접근키</label><input id="key" type="password" autocomplete="off" spellcheck="false">
<button id="run" type="button">직접 업로드 시험</button><button id="cleanup" type="button" hidden>점검 파일 정리 재시도</button>
<button id="runPipeline" type="button">저장·목록 갱신까지 시험</button>
<p>5건, 30건, 100건 순서로 시험합니다. 100건에는 약 180KB의 시험 이미지를 사용하며, 방문 실적으로 등록되지 않습니다.</p>
<button id="runFive" type="button">5건 동시 시험</button> <button id="runThirty" type="button" disabled>30건 동시 시험</button> <button id="runHundred" type="button" disabled>100건 동시 시험</button>
<button id="runLock" type="button">동시 저장 잠금 시험</button>
<button id="cleanupBatch" type="button" hidden>동시 시험 파일 정리 재시도</button>
<div id="result" role="status" aria-live="polite">아직 시험하지 않았습니다.</div>
</main><script>
const run=document.getElementById('run'),clean=document.getElementById('cleanup'),result=document.getElementById('result'),key=document.getElementById('key');
const runFive=document.getElementById('runFive'),runThirty=document.getElementById('runThirty'),runHundred=document.getElementById('runHundred'),cleanBatch=document.getElementById('cleanupBatch');
const runLock=document.getElementById('runLock');
const runPipeline=document.getElementById('runPipeline');
let pendingName=sessionStorage.getItem('myboxDirectProbePending')||'';
let pendingBatch=[];try{const saved=JSON.parse(sessionStorage.getItem('myboxDirectProbeBatchPending')||'[]');if(Array.isArray(saved))pendingBatch=saved;}catch(ignored){}
clean.hidden=!pendingName;
cleanBatch.hidden=!pendingBatch.length;
const pause=ms=>new Promise(resolve=>setTimeout(resolve,ms));
function say(text){result.textContent=text;}
async function api(action,extra={}){
  const response=await fetch('/api/mybox-direct-probe',{method:'POST',cache:'no-store',referrerPolicy:'no-referrer',
    headers:{'Content-Type':'application/json','X-Probe-Key':key.value},body:JSON.stringify({action,...extra})});
  const body=await response.json();if(!response.ok||!body.ok)throw Error(body.message||'점검 서버가 요청을 처리하지 못했습니다.');return body;
}
function photo(){return new Promise((resolve,reject)=>{
  const canvas=document.createElement('canvas');canvas.width=640;canvas.height=360;
  const ctx=canvas.getContext('2d');ctx.fillStyle='#e8effc';ctx.fillRect(0,0,640,360);
  ctx.fillStyle='#16253d';ctx.font='bold 28px system-ui';ctx.fillText('MYBOX CONNECTION TEST',30,160);
  ctx.font='20px system-ui';ctx.fillText('NOT A FIELD VISIT',30,205);
  canvas.toBlob(blob=>blob?resolve(blob):reject(Error('점검 이미지를 만들지 못했습니다.')),'image/jpeg',.7);
});}
async function batchPhoto(){
  const original=new Uint8Array(await (await photo()).arrayBuffer());
  const target=180000,parts=[original.slice(0,2)];
  let remaining=target-original.length;
  while(remaining>=4){
    const payload=Math.min(65533,remaining-4),segment=new Uint8Array(payload+4);
    segment[0]=0xff;segment[1]=0xfe;segment[2]=(payload+2)>>8;segment[3]=(payload+2)&255;
    parts.push(segment);remaining-=segment.length;
  }
  parts.push(original.slice(2));
  return new Blob(parts,{type:'image/jpeg'});
}
async function inspect(name){for(let i=0;i<3;i++){const value=await api('inspect',{name});if(value.found)return value;await pause(1200);}return {found:false};}
async function finish(name){const value=await api('finish',{name});if(value.movedToTrash){sessionStorage.removeItem('myboxDirectProbePending');pendingName='';clean.hidden=true;}return value;}
clean.onclick=async()=>{if(!pendingName)return;clean.disabled=true;try{const value=await finish(pendingName);say(value.movedToTrash?'점검 사진을 MYBOX 휴지통으로 이동했습니다.':'점검 파일이 없습니다.');}catch(error){say(error.message);}finally{clean.disabled=false;}};
function keepBatch(names){pendingBatch=[...new Set(names)];sessionStorage.setItem('myboxDirectProbeBatchPending',JSON.stringify(pendingBatch));cleanBatch.hidden=!pendingBatch.length;}
async function clearBatch(names){let trashed=0,missing=0,failed=0;
  for(let i=0;i<names.length;i+=30){const data=await api('finishBatch',{names:names.slice(i,i+30)}),removed=new Set(data.results.filter(item=>item.trashed).map(item=>item.name));
    trashed+=removed.size;missing+=data.missing.length;failed+=data.results.length-removed.size;
    keepBatch(pendingBatch.filter(name=>!removed.has(name)));
  }
  return {trashed,missing,failed};
}
cleanBatch.onclick=async()=>{if(!pendingBatch.length)return;cleanBatch.disabled=true;try{const value=await clearBatch(pendingBatch);say('휴지통 이동 '+value.trashed+'건 · 아직 확인되지 않은 파일 '+value.missing+'건 · 정리 실패 '+value.failed+'건');}catch(error){say('정리 실패: '+error.message);}finally{cleanBatch.disabled=false;}};
async function single(pipeline){
  if(!key.value){say('점검 접근키를 입력해 주세요.');return;}
  run.disabled=runPipeline.disabled=true;let name='',direct='',fallback='',found=false,start=performance.now(),reserveMs=0,uploadMs=0;
  try{
    say('MYBOX 업로드 URL을 발급받는 중…');const blob=await photo(),reserved=await api('reserve',{size:blob.size});
    reserveMs=Math.round(performance.now()-start);name=reserved.name;pendingName=name;
    sessionStorage.setItem('myboxDirectProbePending',name);clean.hidden=false;
    const form=new FormData();form.append('Filedata',blob,name);const begun=performance.now();
    say('휴대폰 브라우저에서 MYBOX로 직접 보내는 중…');
    try{const response=await fetch(reserved.uploadUrl,{method:'POST',mode:'cors',credentials:'omit',referrerPolicy:'no-referrer',body:form,redirect:'error'});
      direct='브라우저 응답 HTTP '+response.status;
    }catch(error){direct='브라우저가 업로드 응답을 읽지 못함(CORS 또는 연결 오류)';}
    uploadMs=Math.round(performance.now()-begun);
    found=(await inspect(name)).found;
    if(!found&&direct.startsWith('브라우저가')){
      say('브라우저의 응답 제한을 확인했습니다. 응답을 읽지 않는 전송도 시험 중…');
      try{await fetch(reserved.uploadUrl,{method:'POST',mode:'no-cors',credentials:'omit',referrerPolicy:'no-referrer',body:form});fallback='응답을 읽지 않는 전송 요청 완료';}
      catch(error){fallback='응답을 읽지 않는 전송도 브라우저가 거절함';}
      found=(await inspect(name)).found;
    }
    const cleanup=pipeline&&found?await api('pipelineCheck',{name}):await finish(name);
    if(pipeline&&found&&!cleanup.cleanupNeeded){sessionStorage.removeItem('myboxDirectProbePending');pendingName='';clean.hidden=true;}
    say('URL 발급: '+reserveMs+'ms\n직접 전송 시도: '+uploadMs+'ms\n'+direct+
      (fallback?'\n'+fallback:'')+'\nMYBOX 파일 확인: '+(found?'저장됨':'저장 안 됨')+
      (pipeline&&found?'\n사진 이동·재확인: '+(cleanup.movedAndVerified?'정상':'실패')+
        '\n목록 파일 저장·재확인: '+(cleanup.indexVerified?'정상':'실패')+
        '\n점검 항목 휴지통 이동: '+cleanup.trashed+'개':
        '\n점검 파일: '+(cleanup.movedToTrash?'휴지통으로 이동':'저장된 파일 없음')));
  }catch(error){say('점검 중단: '+error.message+'\n'+(name?'점검 파일이 남았을 수 있습니다. 정리 재시도 버튼을 눌러주세요.':''));}
  finally{run.disabled=runPipeline.disabled=false;}
}
run.onclick=()=>single(false);
runPipeline.onclick=()=>single(true);
async function batch(count){
  if(!key.value){say('점검 접근키를 입력해 주세요.');return;}
  run.disabled=runFive.disabled=runThirty.disabled=runHundred.disabled=true;
  const lines=[],names=[];let allGood=false;
  try{
    const blob=await batchPhoto(),start=performance.now();say(count+'건 업로드 URL을 준비하는 중…');
    const reserved=await api('reserveBatch',{count,size:blob.size});
    const reserveMs=Math.round(performance.now()-start),items=reserved.results.filter(item=>item.ok);
    names.push(...items.map(item=>item.name));keepBatch([...pendingBatch,...names]);
    lines.push('URL 발급 '+items.length+'/'+count+'건 · '+reserveMs+'ms');
    if(!items.length)throw Error('업로드 URL을 발급받지 못했습니다. '+(reserved.results[0]?.message||''));
    const uploadStart=performance.now();say(items.length+'건을 브라우저에서 MYBOX로 동시에 보내는 중…');
    const uploads=await Promise.all(items.map(async item=>{
      const form=new FormData();form.append('Filedata',blob,item.name);
      try{const response=await fetch(item.uploadUrl,{method:'POST',mode:'cors',credentials:'omit',referrerPolicy:'no-referrer',body:form,redirect:'error'});
        return {name:item.name,status:response.status,ok:response.ok};}
      catch(error){return {name:item.name,status:0,ok:false};}
    }));
    const uploadMs=Math.round(performance.now()-uploadStart),uploadOk=uploads.filter(item=>item.ok).length;
    const totalMB=(blob.size*items.length/1000000).toFixed(2);
    const throughput=uploadMs>0?(blob.size*items.length/uploadMs/1000).toFixed(2):'—';
    lines.push('동시 전송 HTTP 성공 '+uploadOk+'/'+items.length+'건 · '+uploadMs+'ms');
    lines.push('시험 데이터 '+totalMB+'MB · 전송 구간 평균 '+throughput+'MB/s');
    let checked={present:[],mismatch:[],missing:names};
    for(let attempt=0;attempt<3;attempt++){
      checked=await api('statusBatch',{names,size:blob.size});
      if(!checked.missing.length&&!checked.mismatch.length)break;await pause(1200);
    }
    lines.push('MYBOX 저장 확인 '+checked.present.length+'/'+items.length+'건');
    if(checked.mismatch.length)lines.push('파일 크기 불일치 '+checked.mismatch.length+'건');
    allGood=items.length===count&&uploadOk===count&&checked.present.length===count;
    if(!allGood)lines.push('일부 실패 또는 지연이 있습니다. 이 결과만으로 독립 사용자들의 동시 업로드를 보장할 수 없습니다.');
  }catch(error){lines.push('점검 중단: '+error.message);}
  finally{
    if(names.length){
      try{const cleaned=await clearBatch(names);lines.push('시험 사진 휴지통 이동 '+cleaned.trashed+'/'+names.length+'건');
        if(cleaned.missing||cleaned.failed)lines.push('미정리 '+(cleaned.missing+cleaned.failed)+'건 · 정리 재시도 가능');
        allGood=allGood&&cleaned.trashed===names.length;}
      catch(error){lines.push('정리 실패: '+error.message+' · 정리 재시도 버튼을 눌러주세요.');allGood=false;}
    }
    run.disabled=runFive.disabled=false;
    if(count===5)runThirty.disabled=!allGood;
    else if(count===30)runHundred.disabled=!allGood;
    say(lines.join('\n'));
  }
}
runFive.onclick=()=>batch(5);
runThirty.onclick=()=>batch(30);
runHundred.onclick=()=>batch(100);
runLock.onclick=async()=>{
  if(!key.value){say('점검 접근키를 입력해 주세요.');return;}
  runLock.disabled=true;say('MYBOX 같은 이름 폴더의 동시 생성을 확인하는 중…');
  try{const value=await api('lockCheck');say('동시 생성 응답: '+value.statuses.join(' / ')+
    '\n같은 이름 폴더: '+value.sameNameFolders+'개\n시험 폴더 휴지통 이동: '+value.trashed+'개'+
    '\n주소별 2장 제한에 필요한 잠금: '+(value.atomic?'정상':'검증 실패')+
    (value.cleanupNeeded?'\n점검 폴더 정리가 필요합니다.':''));}
  catch(error){say('잠금 점검 실패: '+error.message);}finally{runLock.disabled=false;}
};
</script></body></html>
