<script>
/* =======================================================================
   전국 주소 지도 — 동작 개요 (초보자용 설명)
   -----------------------------------------------------------------------
   [데이터] addresses.js 가 window.ADDR_DATA 라는 큰 객체를 만들어 둡니다.
     구조: { 시도 : { 구군 : { 동 : [ 주소배열, 주소배열, ... ] } } }
     주소배열 한 개 = [ 위도, 경도, "주소글자", 사업장수, 정밀여부 ]
        · 정밀여부 1 = 기존 정밀 좌표(지도에 파란 점)
        · 정밀여부 0 = 대략 위치(주황 점 · '확인필요')
     예) ADDR_DATA["서울특별시"]["강남구"]["역삼동"][0]
         = [37.49, 127.03, "서울특별시 강남구 …", 1, 1]

   [화면] 배경 = 지도(Leaflet 라이브러리) / 위 = 헤더 / 아래 = 목록 패널
     목록 패널에서 시도 → 구 → 동 → 주소 순서로 좁혀 들어갑니다(드릴다운).

   [핵심 아이디어] 주소가 4만 개라, 지도 점(마커)을 '한꺼번에' 만들면
     휴대폰이 몇 초간 멈춥니다. 그래서 ① 목록(글자)부터 먼저 그리고
     ② 마커는 필요한 것만 만들어 재사용(캐시)합니다.
   ======================================================================= */

var DATA = window.ADDR_DATA || {};   // 위에서 설명한 큰 데이터 객체(없으면 빈 객체)
var META = window.ADDR_META || {};
var map, cluster, myMarker = null;   // map=지도, cluster=마커묶음, myMarker=내 위치 점
var panel = document.getElementById('panel');   // 아래 목록 패널
var listEl = document.getElementById('list');    // 목록이 그려지는 곳
var crumbEl = document.getElementById('crumb');   // '전체 › 서울 › 강남구' 경로 표시줄
var sel = { sido:null, gugun:null, dong:null };   // 지금 어디까지 골랐는지 기억

// esc: 주소에 <, >, & 같은 특수문자가 있어도 화면이 깨지지 않게 안전한 글자로 바꿈
function esc(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
// 목록의 숫자는 주소 행 수가 아니라 원자료의 사업자수 합계이다.
function countBusinesses(arr){ return arr.reduce(function(n,p){ return n+(Number(p[3])||1); },0); }
function countGugun(g){ var n=0; for(var d in g) n+=countBusinesses(g[d]); return n; }
function countSido(s){ var n=0; for(var g in s) n+=countGugun(s[g]); return n; }
function hasCoordinates(p){ return p[0]!=null && p[1]!=null && Number.isFinite(p[0]) && Number.isFinite(p[1]) && Math.abs(p[0])<=90 && Math.abs(p[1])<=180; }
// collect*: 한 구/시도 안의 모든 주소를 하나의 목록으로 합침(지도 범위 맞출 때 사용)
function collectGugun(g){ var out=[]; for(var d in g) out=out.concat(g[d]); return out; }
function collectSido(s){ var out=[]; for(var g in s) out=out.concat(collectGugun(s[g])); return out; }

var dotIcon   = L.divIcon({ className:'', html:'<div class="addr-dot"></div>', iconSize:[16,16], iconAnchor:[8,8] });
var dotApprox = L.divIcon({ className:'', html:'<div class="addr-dot approx"></div>', iconSize:[16,16], iconAnchor:[8,8] });
var selIcon   = L.divIcon({ className:'', html:'<div class="sel-dot"></div>', iconSize:[22,22], iconAnchor:[11,11] });
var redIcon   = L.divIcon({ className:'', html:'<div class="my-dot"></div>', iconSize:[20,20], iconAnchor:[10,10] });

var visibleMode = false;   // 화면에 보이는 주소 목록 모드
var searchMode=false,searchEngine=null,searchTimer=null;
var suppressAutoUntil = 0;  // 이 시각 이전의 moveend는 '프로그램 이동'으로 보고 자동목록 억제(자동 만료)

// ── 성능: 마커는 '필요할 때 생성 + 재사용', 표시는 잘게 쪼개 비동기로 ──
// 42,401개를 로드 즉시 한꺼번에 만들면 화면이 멈춰 버튼이 안 먹힌다.
// 그래서 (1) 목록부터 그리고 (2) 마커는 선택 범위만 지연 생성/캐시한다.
var ALL = [];                    // 평면 인덱스 {p, real, s, g, d}
var recordByPoint = new Map();
var markerCache = new Map();     // 점 → L.marker (한 번만 생성)
var _showToken = 0;              // 표시 작업 토큰(새 선택이 오면 옛 작업 취소)

// buildIndex: 3중으로 중첩된 데이터(시도>구>동)를 훑어서
//   ALL(주소 한 줄짜리 평평한 목록)로 펼친다. 정밀/대략 개수도 함께 센다.
function buildIndex(){
  var nReal = 0, nApprox = 0;
  for(var sido in DATA) for(var gugun in DATA[sido]) for(var dong in DATA[sido][gugun]){
    var arr = DATA[sido][gugun][dong];
    for(var i=0;i<arr.length;i++){
      var p = arr[i];
      var real = hasCoordinates(p) && !!p[4];
      var entry = { p:p, real:real, s:sido, g:gugun, d:dong };
      ALL.push(entry); recordByPoint.set(p,entry);
      if(real) nReal++; else nApprox++;
    }
  }
  return { nReal:nReal, nApprox:nApprox };
}
// getMarker: 주소 한 개의 '지도 점(마커)'을 만든다.
//   이미 만든 적 있으면 새로 안 만들고 그대로 재사용(markerCache) → 빠르고 메모리 절약.
function getMarker(rec){
  var m = markerCache.get(rec.p);
  if(m) return m;
  m = L.marker([rec.p[0], rec.p[1]], { icon: rec.real ? dotIcon : dotApprox });
  m._d = rec.p; m._s = rec.s; m._g = rec.g; m._n = rec.d;
  m.on('click', function(e){ openPopup(e.target, e.target._d); });
  markerCache.set(rec.p, m);
  return m;
}

function initMap(){
  setPanel(defaultH());
  map = L.map('map', { zoomControl:true, preferCanvas:true }).setView([36.4,127.9], 7);
  L.tileLayer('https://mt{s}.google.com/vt/lyrs=m&hl=ko&x={x}&y={y}&z={z}', {
    subdomains:['0','1','2','3'], maxZoom:20, attribution:'&copy; Google Maps'
  }).addTo(map);

  // 줌 18↑에선 클러스터를 풀어 개별 점을 직접 클릭 가능(그 줌에선 화면에 점 몇 개뿐 → 프리즈 없음).
  // 줌 17↓은 계속 클러스터(밀집지역 수천 개 개별 렌더 방지).
  cluster = L.markerClusterGroup({
    chunkedLoading:true, chunkInterval:200, chunkDelay:20,
    maxClusterRadius:70, disableClusteringAtZoom:18, spiderfyOnMaxZoom:true, removeOutsideVisibleBounds:true,
    iconCreateFunction:function(c){
      var n=c.getChildCount(), size = n<100?38:n<1000?46:54;
      var label = n>=10000 ? Math.round(n/1000)+'k' : (n>=1000 ? (Math.round(n/100)/10)+'k' : n);
      return L.divIcon({ className:'kc', iconSize:[size,size],
        html:'<div class="kc-inner">'+label+'</div>' });
    }
  });
  map.addLayer(cluster);

  var cnt = buildIndex();   // 평면 인덱스만 먼저(가벼움)
  document.getElementById('totalCnt').textContent = ALL.length.toLocaleString();
  var businesses = Object.keys(DATA).reduce(function(n,s){ return n+countSido(DATA[s]); },0);
  document.getElementById('businessCnt').textContent = businesses.toLocaleString();
  document.getElementById('nReal').textContent = cnt.nReal.toLocaleString();
  document.getElementById('nApprox').textContent = cnt.nApprox.toLocaleString();

  renderSido();                                     // ★ 목록 먼저 → 버튼 즉시 작동
  var _ld=document.getElementById('loading'); if(_ld) _ld.remove();   // 로딩 표시 제거
  setTimeout(function(){ showMarkers(null, 'ALL'); }, 0);  // 전체 마커는 뒤에서 천천히

  // 확대(줌 15↑)하면 화면에 보이는 주소를 자동으로 목록에 띄움 (디바운스로 과도한 갱신 방지)
  var _visTimer=null;
  map.on('moveend', function(){
    if(searchMode)return;
    if(Date.now() < suppressAutoUntil){ return; }     // 프로그램이 옮긴 거면 무시(자동 만료)
    clearTimeout(_visTimer);
    _visTimer=setTimeout(function(){
      if(map.getZoom() >= 15){ renderVisible(); }
      else if(visibleMode){ exitVisible(); }          // 다시 축소하면 드릴다운 복귀
    }, 220);
  });
}

// 선택 범위(filter)에 맞는 점만 표시. 생성/추가를 2000개씩 끊어 비동기 처리(모바일 대응).
// key가 현재 화면과 같으면 재구성 생략 → 줌 인/아웃 반복해도 42k 마커 재렌더 안 함(렉 방지).
var _curKey = null;
function showMarkers(filter, key){
  if(key != null && key === _curKey) return;
  if(selMarker){var previous=selMarker;selMarker=null;map.removeLayer(previous);}
  _curKey = key;
  var token = ++_showToken;
  cluster.clearLayers();
  var recs = [];
  for(var i=0;i<ALL.length;i++){ if(hasCoordinates(ALL[i].p) && (!filter || filter(ALL[i]))) recs.push(ALL[i]); }
  var CH = 2000, idx = 0;
  (function step(){
    if(token !== _showToken) return;                // 새 선택이 들어오면 이 작업 중단
    var slice = [], end = Math.min(idx+CH, recs.length);
    for(; idx<end; idx++) slice.push(getMarker(recs[idx]));
    if(slice.length) cluster.addLayers(slice);
    if(idx < recs.length) setTimeout(step, 0);
  })();
}

// openPopup: 마커/주소를 눌렀을 때 뜨는 말풍선.
//   주소 + (대략위치 경고) + (사업장 개수) + 구글지도 열기/길안내 버튼.
//   말풍선이 아래 패널에 가리지 않도록 지도를 자동으로 살짝 옮긴다(autoPan).
function openPopup(marker, rec){
  var q = encodeURIComponent(rec[2]);
  var search = 'https://www.google.com/maps/search/?api=1&query=' + q;
  var nav = 'https://www.google.com/maps/dir/?api=1&destination=' + q;
  var cnt = rec[3] || 1;
  var approx = rec[4] ? false : true;
  var entry = recordByPoint.get(rec);
  var admin = entry ? '<div class="popup-sub">집계 관할: '+esc(entry.s+' '+entry.g+' '+entry.d)+'</div>' : '';
  var html = '<div class="popup-addr">' + esc(rec[2]) + '</div>' +
    admin +
    (rec[6] && !rec[5] ? '<div class="popup-warn">행정동 미확정 · 시군구 합계에는 포함</div>' : '') +
    (!rec[6] ? '<div class="popup-sub">원주소 분류 · 한글 행정동 대조 대상 외</div>' : '') +
    (approx ? '<div class="popup-warn">근사 좌표 · 위치 확인 필요</div>' : '') +
    '<div class="popup-sub tag-biz">이 주소 사업자수 ' + cnt + '개</div>' +
    photoLinkHtml(rec[2])+
    '<div class="popup-links"><a class="pbtn" href="' + search + '" target="_blank" rel="noopener">구글 지도</a>' +
    '<a class="pbtn" href="' + nav + '" target="_blank" rel="noopener">길찾기</a></div>';
  // 팝업이 항상 '보이는 영역'(헤더 아래·패널 위)에 뜨도록 자동 이동 여백 지정
  var inset=mapInsets();
  suppressAutoUntil = Date.now() + 900;   // 이 자동 이동은 화면목록 갱신 대상 아님
  marker.bindPopup(html, {maxWidth:264, autoPan:true,
    autoPanPaddingTopLeft: inset.topLeft,
    autoPanPaddingBottomRight: inset.bottomRight}).openPopup();
}

// Public endpoint only; credentials are never included in the map or its links.
function photoUrl(address){
  var config=window.PHOTO_CONFIG||{}, base=String(config.webAppUrl||'');
  if(!/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(base)) return '';
  return './photo?address='+encodeURIComponent(address)+'&build='+encodeURIComponent(config.build||'v5');
}
var adminPhotoEntry=photoUrl(''), adminPhotoLink=document.getElementById('photoAdminLink');
if(adminPhotoEntry&&adminPhotoLink){adminPhotoLink.href=window.PHOTO_CONFIG.webAppUrl+'?page=admin&build='+encodeURIComponent(window.PHOTO_CONFIG.build||'v5');adminPhotoLink.hidden=false;}
function photoLinkHtml(address){
  var url=photoUrl(address);
  return url ? '<a class="pbtn search" href="'+url+'" target="_blank" rel="noopener noreferrer">현장 사진 등록·보기</a>' :
    '<div class="popup-sub">사진 등록을 준비 중입니다.</div>';
}

function fitToRecords(records){
  var pts = records.filter(function(p){ return p[0]!=null; }).map(function(p){ return [p[0],p[1]]; });
  if(!pts.length) return;
  suppressAutoUntil = Date.now() + 900;   // 드릴다운이 지도 옮기는 건 '화면 목록' 자동표시 대상 아님
  if(pts.length===1){ map.setView(pts[0], 16); }
  else { var inset=mapInsets();map.fitBounds(L.latLngBounds(pts), {paddingTopLeft:inset.topLeft,paddingBottomRight:inset.bottomRight}); }
}

// 지도 위 목록과 헤더를 피해서 주소·팝업이 보이도록 한다.
function mapInsets(){
  var wide=window.innerWidth>=900,collapsed=panel.classList.contains('is-collapsed');
  var height=collapsed?56:panelPx();
  return {topLeft:L.point(wide?panel.getBoundingClientRect().right+16:16,wide?16:document.getElementById('mapHeader').getBoundingClientRect().bottom+12),
    bottomRight:L.point(wide?76:16,wide?16:height+16)};
}

// ── 드릴다운(단계별 좁히기): 시도 → 구 → 동 → 주소 ──
//   각 render* 함수가 목록을 다시 그리고, 지도도 해당 범위 점만 보여준다.
//   setCrumb=경로표시줄, navRow=목록 한 줄, addBack=뒤로 버튼.
function setCrumb(){
  var steps=[{label:'전체',action:'renderSido()'}];
  if(sel.sido)steps.push({label:sel.sido,action:'renderGugun()'});
  if(sel.gugun)steps.push({label:sel.gugun,action:'renderDong()'});
  if(sel.dong)steps.push({label:sel.dong,action:'renderAddr()'});
  crumbEl.innerHTML=steps.map(function(step,index){return (index?'<span class="sep" aria-hidden="true">›</span>':'')+'<button type="button" onclick="'+step.action+'"'+(index===steps.length-1?' aria-current="location"':'')+'>'+esc(step.label)+'</button>';}).join('');
}
function clearList(){listEl.innerHTML='';listEl.scrollTop=0;}
function addBack(fn){ var b=document.createElement('div'); b.className='back'; b.tabIndex=0; b.setAttribute('role','button'); b.textContent='‹ 뒤로'; b.onclick=fn; listEl.appendChild(b); }
function navRow(label, count, onClick){
  var r=document.createElement('div'); r.className='row'; r.tabIndex=0; r.setAttribute('role','button');
  r.setAttribute('aria-label',label+' 사업자수 '+count.toLocaleString()+'개');
  r.innerHTML='<span class="name">'+esc(label)+'</span><span class="badge">'+count.toLocaleString()+'개</span><span class="chev">›</span>';
  r.onclick=onClick; listEl.appendChild(r);
}
// 목록/뒤로 버튼을 키보드(Enter·Space)로도 실행
listEl.addEventListener('keydown', function(e){
  if(e.target.closest && e.target.closest('a,button,input')) return;
  if(e.key==='Enter' || e.key===' '){
    var row = e.target.closest && e.target.closest('.row, .back');
    if(row){ e.preventDefault(); row.click(); }
  }
});
function addScopeNote(records, extra){
  var note=document.createElement('details');note.className='scope-note';
  var target=records.filter(function(p){return !!p[6];}).length;
  var pending=records.filter(function(p){return !!p[6] && !p[5];});
  var summary=document.createElement('summary'),detail=document.createElement('p');
  summary.textContent='사업자 '+countBusinesses(records).toLocaleString()+'개 · 주소 '+records.length.toLocaleString()+'곳'+(pending.length?' · 행정동 미확정 '+countBusinesses(pending)+'개':'');
  detail.textContent=(target===records.length?'한글 문서의 행정동 분류를 반영했습니다.':target===0?'원자료의 주소 분류입니다. 한글 행정동 대조 대상은 아닙니다.':'한글 대조 지역과 원자료 분류가 함께 포함돼 있습니다.')+(extra?' '+extra:'');
  note.append(summary,detail);
  listEl.appendChild(note);
}
function renderSido(){
  searchMode=false;
  visibleMode=false;
  sel={sido:null,gugun:null,dong:null}; setCrumb(); clearList();
  showMarkers(null, 'ALL');
  var keys=Object.keys(DATA).sort();
  if(keys.length===0){   // 데이터(addresses.js) 로드 실패 시 안내
    var m=document.createElement('div'); m.className='vis-head'; m.style.color='var(--red)';
    m.textContent='⚠ 데이터를 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침 해주세요.';
    listEl.appendChild(m); expandPanel(); return;
  }
  addScopeNote(ALL.map(function(r){return r.p;}),'목록 숫자는 주소 수가 아닌 사업자수입니다.');
  keys.forEach(function(s){ navRow(s, countSido(DATA[s]), function(){ sel.sido=s; renderGugun(); }); });
  expandPanel();
}
function renderGugun(){
  sel.gugun=null; sel.dong=null; setCrumb(); clearList(); addBack(renderSido);
  var s=sel.sido;
  showMarkers(function(r){ return r.s===s; }, 'S:'+s);
  fitToRecords(collectSido(DATA[s]));
  var g=DATA[s];
  addScopeNote(collectSido(g),s==='충청북도'?'한글 대상 청주시는 아래 청주시 4개 구 합계 708개입니다.':'');
  Object.keys(g).sort().forEach(function(k){ navRow(k, countGugun(g[k]), function(){ sel.gugun=k; renderDong(); }); });
}
function renderDong(){
  sel.dong=null; setCrumb(); clearList(); addBack(renderGugun);
  var s=sel.sido, gg=sel.gugun;
  showMarkers(function(r){ return r.s===s && r.g===gg; }, 'G:'+s+'/'+gg);
  fitToRecords(collectGugun(DATA[s][gg]));
  var g=DATA[s][gg];
  var yp=META.originalYeongdeungpo;
  var ypNote=s==='서울특별시' && gg==='영등포구' && yp ?
    '원주소 영등포구 '+yp.businesses+'개 중 '+yp.sameOriginalDistrictBusinesses+'개와 타 구 원주소 '+yp.incomingFromOtherOriginalDistricts+'개를 합친 현행 관할 수량입니다. 원주소 영등포구의 나머지 '+yp.otherDistrictBusinesses+'개는 '+yp.otherDistrict+'에 포함했습니다.' : '';
  addScopeNote(collectGugun(g),ypNote);
  Object.keys(g).sort().forEach(function(k){ navRow(k, countBusinesses(g[k]), function(){ sel.dong=k; renderAddr(); }); });
}
function renderAddr(){
  visibleMode=false;
  setCrumb(); clearList(); addBack(renderDong);
  var s=sel.sido, gg=sel.gugun, dd=sel.dong;
  var arr=DATA[s][gg][dd];
  addScopeNote(arr);
  showMarkers(function(r){ return r.s===s && r.g===gg && r.d===dd; }, 'D:'+s+'/'+gg+'/'+dd);
  arr.forEach(appendAddrRow);
  fitToRecords(arr);
}

// 주소 한 줄(확인필요·사업장수 태그 + 클릭 시 그 지점으로 이동 + 빨간 물결 마커)
function appendAddrRow(p){
  var r=document.createElement('article'); r.className='row addr-row';
  var select=document.createElement('button');select.type='button';select.className='addr-select';select.textContent=p[2];select.setAttribute('aria-label',p[2]+' 지도에서 보기');
  var sub=[];
  if(!p[4]) sub.push('<span class="tag-check">좌표 확인필요</span>');
  if(p[6] && !p[5]) sub.push('<span class="tag-check">행정동 미확정</span>');
  sub.push('<span class="tag-biz">사업자수 '+(p[3]||1)+'개</span>');
  var info=document.createElement('div');info.className='sub';info.innerHTML=sub.join('');r.append(select,info);
  select.onclick=function(){
    if(!hasCoordinates(p)){ alert('이 주소는 좌표가 없습니다. 원주소와 사업자수는 집계에 포함되어 있습니다.'); return; }
    collapsePanel();suppressAutoUntil = Date.now() + 900; map.setView([p[0],p[1]], 18);
    showSelected(p);
  };
  var photo=document.createElement('a'), photoHref=photoUrl(p[2]);
  photo.className='photo-action';
  photo.textContent=photoHref?'사진 등록·보기':'사진 등록 준비 중';
  if(photoHref){
    photo.href=photoHref; photo.target='_blank'; photo.rel='noopener noreferrer';
    photo.onclick=function(e){e.stopPropagation();};
  } else { photo.setAttribute('aria-disabled','true'); }
  r.appendChild(photo);
  listEl.appendChild(r);
}

// 선택 마커는 '1개만' 재사용(연타해도 누적/누수 없음)
var selMarker = null;
function showSelected(p){
  if(selMarker){ map.removeLayer(selMarker); selMarker=null; }   // 이전 선택 마커 먼저 제거
  selMarker = L.marker([p[0],p[1]], {icon:selIcon, zIndexOffset:900}).addTo(map);
  selMarker.on('popupclose', function(){ if(selMarker){ map.removeLayer(selMarker); selMarker=null; } });
  openPopup(selMarker, p);
}

// 확대(줌 15↑) 시 화면에 보이는 주소들을 목록으로
function renderVisible(){
  if(searchMode)return;
  var entering = !visibleMode;
  visibleMode = true;
  sel={sido:null,gugun:null,dong:null};
  showMarkers(null, 'ALL');   // 지도에도 화면 내 모든 점 표시(목록↔지도 일치). dedup으로 이미 전체면 무시
  var b=map.getBounds(), pts=[];
  for(var i=0;i<ALL.length && pts.length<600;i++){
    var q=ALL[i].p;
    if(q[0]!=null && b.contains([q[0],q[1]])) pts.push(q);
  }
  crumbEl.innerHTML='<button type="button" onclick="exitVisible()">전체</button><span class="sep" aria-hidden="true">›</span><span aria-current="location">화면에 보이는 주소</span>';
  clearList();
  var back=document.createElement('div'); back.className='back'; back.tabIndex=0; back.setAttribute('role','button');
  back.textContent='‹ 지역 선택으로'; back.onclick=exitVisible; listEl.appendChild(back);
  var head=document.createElement('div'); head.className='vis-head';
  head.textContent='이 화면에 보이는 주소 '+pts.length+'개'+(pts.length>=600?'+ (더 확대하면 줄어요)':'');
  listEl.appendChild(head);
  pts.forEach(appendAddrRow);
  if(entering) expandPanel();
}
function exitVisible(){ visibleMode=false; renderSido(); }

function initDataInfo(){
  document.getElementById('dataSummary').textContent='최종 한글 대상 사업자 '+Number(META.targetBusinesses||0).toLocaleString()+'개. 전국 '+Number(META.nationalBusinesses||0).toLocaleString()+'개, 원주소 '+Number(META.nationalAddresses||0).toLocaleString()+'건은 보존했습니다.';
  var body=document.getElementById('dataControls');
  (META.controls||[]).forEach(function(c){
    var tr=document.createElement('tr');
    [c.region,c.businesses,c.districts,c.dongs,c.unresolved].forEach(function(v){var td=document.createElement('td');td.textContent=typeof v==='number'?v.toLocaleString():v;tr.appendChild(td);});
    body.appendChild(tr);
  });
  (META.unresolved||[]).forEach(function(r){var li=document.createElement('li');li.textContent=r.address+' — 사업자수 '+r.businesses+'개';document.getElementById('dataUnresolved').appendChild(li);});
  (META.notes||[]).forEach(function(t){var li=document.createElement('li');li.textContent=t;document.getElementById('dataNotes').appendChild(li);});
  var dialog=document.getElementById('dataDialog');
  document.getElementById('dataInfoBtn').onclick=function(){dialog.showModal();};
  document.getElementById('closeDataDialog').onclick=function(){dialog.close();};
  dialog.addEventListener('close',function(){document.getElementById('menuTrigger').focus();});
}

// ── 패널: 손잡이 드래그로 크기 조절 + 톡 누르면 접기/펴기 ──
function panelPx(){ return panel.getBoundingClientRect().height; }
function panelMax(){return Math.max(56,window.innerHeight-(window.innerWidth>=900?128:100));}
function setPanel(px){
  px=Math.min(panelMax(),Math.max(56,Math.round(px)));var collapsed=px<=64;
  panel.style.height=px+'px';panel.classList.toggle('is-collapsed',collapsed);
  document.getElementById('map').style.setProperty('--map-footer-bottom',window.innerWidth>=900?'4px':(px+4)+'px');
  document.getElementById('panelContent').hidden=collapsed;
  var toggle=document.getElementById('panelToggle');toggle.textContent=collapsed?'목록 열기':'목록 접기';toggle.setAttribute('aria-expanded',String(!collapsed));
}
function defaultH(){return window.innerWidth>=900?panelMax():Math.min(panelMax(),Math.round(window.innerHeight*.48));}
function expandPanel(){if(panel.classList.contains('is-collapsed')||panelPx()<120)setPanel(defaultH());}
function collapsePanel(){setPanel(56);}
document.getElementById('panelToggle').onclick=function(e){e.stopPropagation();if(panel.classList.contains('is-collapsed'))setPanel(defaultH());else collapsePanel();};
(function(){
  var handle=document.getElementById('panelHandle');
  var startY=0, startH=0, dragging=false, moved=false;
  function down(e){
    if(window.innerWidth>=900||(e.target&&e.target.closest&&e.target.closest('button')))return;
    dragging=true; moved=false;
    startY=(e.touches?e.touches[0].clientY:e.clientY); startH=panelPx();
    panel.classList.add('dragging');
    if(handle.setPointerCapture && e.pointerId!=null){ try{ handle.setPointerCapture(e.pointerId); }catch(_){} }
  }
  function move(e){
    if(!dragging) return;
    var y=(e.touches?e.touches[0].clientY:e.clientY);
    var dy=startY-y;
    if(Math.abs(dy)>5) moved=true;
    var h=Math.min(panelMax(), Math.max(56, startH+dy));
    setPanel(h);
    if(e.cancelable) e.preventDefault();
  }
  function up(){
    if(!dragging) return;
    dragging=false; panel.classList.remove('dragging');
    if(!moved){setPanel(panelPx()>120?56:defaultH());}
  }
  handle.addEventListener('pointerdown', down);
  window.addEventListener('pointermove', move, {passive:false});
  window.addEventListener('pointerup', up);
  // 구형 터치 폴백
  handle.addEventListener('touchstart', down, {passive:false});
  window.addEventListener('touchmove', move, {passive:false});
  window.addEventListener('touchend', up);
  // 브라우저가 드래그를 중단(pointercancel/touchcancel)해도 상태가 안 끼게 정리
  window.addEventListener('pointercancel', up);
  window.addEventListener('touchcancel', up);
})();

var mapMenu=document.getElementById('mapMenu');
window.addEventListener('pointerdown',function(e){if(mapMenu.open&&!mapMenu.contains(e.target))mapMenu.open=false;});
window.addEventListener('keydown',function(e){if(e.key==='Escape'&&mapMenu.open){mapMenu.open=false;document.getElementById('menuTrigger').focus();}});
mapMenu.addEventListener('click',function(e){if(e.target.closest('a,button'))mapMenu.open=false;});
var wideLayout=window.innerWidth>=900,layoutTimer=null;
window.addEventListener('resize',function(){
  clearTimeout(layoutTimer);layoutTimer=setTimeout(function(){
    var nextWide=window.innerWidth>=900;
    if(nextWide!==wideLayout){wideLayout=nextWide;setPanel(panel.classList.contains('is-collapsed')?56:defaultH());}
    else document.getElementById('map').style.setProperty('--map-footer-bottom',nextWide?'4px':(Math.min(parseFloat(panel.style.height)||panelPx(),panelMax())+4)+'px');
  },100);
});
document.getElementById('gpsBtn').addEventListener('click', function(){
  if(!navigator.geolocation){ alert('위치 기능을 지원하지 않습니다.'); return; }
  var btn=this;
  if(btn.classList.contains('loading')) return;      // 이미 조회 중이면 중복 실행 안 함
  btn.classList.add('loading');
  // 한 번만 불러옴(추적 X) → 지도 안 튐. 타임아웃 30초(넉넉) → 위치 못 잡아도 무한로딩 안 됨.
  var done=false;
  function stop(){ done=true; btn.classList.remove('loading'); }
  navigator.geolocation.getCurrentPosition(function(pos){
    if(done) return; stop();
    var ll=[pos.coords.latitude, pos.coords.longitude];
    if(myMarker){ myMarker.setLatLng(ll); }
    else { myMarker=L.marker(ll, {icon:redIcon, zIndexOffset:1000}).addTo(map).bindPopup('📍 현재 내 위치'); }
    myMarker.openPopup();
    suppressAutoUntil = Date.now() + 900; map.setView(ll, 16);
  }, function(err){
    if(done) return; stop();
    var msg = err && err.code===1 ? '위치 권한이 거부됐어요. 브라우저 설정에서 위치 접근을 허용해 주세요.'
            : err && err.code===3 ? '위치를 시간 내에 못 잡았어요. 실외에서 다시 시도해 보세요.'
            : '위치를 가져올 수 없습니다.';
    alert(msg);
  }, { enableHighAccuracy:true, maximumAge:30000, timeout:30000 });
  // 브라우저 콜백이 아예 안 오는 극단적 경우 대비 안전장치(35초 후 로딩 해제)
  setTimeout(function(){ if(!done){ stop(); } }, 35000);
});

function restoreSearchScope(){
  searchMode=false;
  if(sel.dong)renderAddr();else if(sel.gugun)renderDong();else if(sel.sido)renderGugun();else renderSido();
}
function renderSearch(fit){
  var query=document.getElementById('mapSearch').value.trim();
  document.getElementById('clearMapSearch').hidden=!query;
  if(!query){restoreSearchScope();return;}
  searchMode=true;visibleMode=false;crumbEl.textContent='전체 주소 검색';clearList();
  if(!searchEngine)searchEngine=window.AddressSearch.create(ALL);
  var result=searchEngine.find(query,60),note=document.createElement('div');note.className='vis-head';note.setAttribute('role','status');
  note.textContent=result.tooShort?'두 글자 이상 입력해 주세요.':result.total?result.total.toLocaleString()+'곳 · 사업자 '+result.businesses.toLocaleString()+'개':'검색 결과가 없습니다. 지역이나 도로명으로 다시 찾아보세요.';
  listEl.appendChild(note);result.entries.forEach(function(entry){appendAddrRow(entry.p);});
  var points=new Set(result.entries.map(function(entry){return entry.p;}));showMarkers(function(entry){return points.has(entry.p);},'SEARCH:'+query);
  if(fit===true&&result.entries.length)fitToRecords(result.entries.map(function(entry){return entry.p;}));
  if(result.total>result.entries.length){var more=document.createElement('div');more.className='scope-note';more.textContent='앞에서 60곳만 표시합니다. 지역이나 지번을 더 입력해 주세요.';listEl.appendChild(more);}
  expandPanel();
}
function clearSearch(){clearTimeout(searchTimer);document.getElementById('mapSearch').value='';document.getElementById('clearMapSearch').hidden=true;restoreSearchScope();}
document.getElementById('mapSearch').oninput=function(){clearTimeout(searchTimer);searchTimer=setTimeout(renderSearch,160);};
document.getElementById('mapSearch').onkeydown=function(e){if(e.key==='Escape'){e.preventDefault();clearSearch();}};
document.getElementById('clearMapSearch').onclick=clearSearch;
document.getElementById('addressSearchForm').onsubmit=function(e){e.preventDefault();clearTimeout(searchTimer);renderSearch(true);document.getElementById('mapSearch').blur();};
initDataInfo();
initMap();
</script>
