<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0"/>
<title>지역별 주소 지도 (구·동 드릴다운)</title>

<!-- 지도 라이브러리 (로컬 동봉 · API 키 불필요) -->
<link rel="stylesheet" href="./lib/leaflet.css"/>
<link rel="stylesheet" href="./lib/MarkerCluster.css"/>
<link rel="stylesheet" href="./lib/MarkerCluster.Default.css"/>
<script src="./lib/leaflet.js"></script>
<script src="./lib/leaflet.markercluster.js"></script>

<style>
  html, body { margin:0; height:100%; font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif; }
  #map { position:absolute; inset:0; }
  .topbar {
    position:absolute; top:0; left:0; right:0; z-index:1000; height:48px;
    background:rgba(26,115,232,.95); color:#fff; display:flex; align-items:center;
    padding:0 12px; box-shadow:0 2px 6px rgba(0,0,0,.3); font-weight:bold; font-size:15px; gap:10px;
  }
  .topbar .cnt { margin-left:auto; font-weight:normal; font-size:12px; opacity:.9; }
  #panel {
    position:absolute; left:0; right:0; bottom:0; z-index:1001;
    background:#fff; border-radius:16px 16px 0 0; box-shadow:0 -3px 14px rgba(0,0,0,.25);
    max-height:62%; display:flex; flex-direction:column;
    transform:translateY(calc(100% - 46px)); transition:transform .25s ease;
  }
  #panel.open { transform:translateY(0); }
  .panel-handle {
    position:relative; height:46px; flex:0 0 auto; display:flex; align-items:center; justify-content:center;
    cursor:pointer; font-weight:bold; color:#1a73e8; border-bottom:1px solid #eee; gap:8px;
  }
  .panel-handle .bar { position:absolute; top:8px; left:50%; transform:translateX(-50%);
    width:40px; height:4px; background:#ccc; border-radius:2px; }
  #crumb {
    flex:0 0 auto; padding:8px 12px; font-size:13px; color:#444; background:#f6f8fc;
    border-bottom:1px solid #eee; white-space:nowrap; overflow-x:auto;
  }
  #crumb b { color:#1a73e8; cursor:pointer; }
  #crumb .sep { color:#aaa; margin:0 6px; }
  #list { overflow-y:auto; -webkit-overflow-scrolling:touch; padding:6px 0 14px; }
  .row { display:flex; align-items:center; gap:8px; padding:11px 14px; cursor:pointer;
    border-bottom:1px solid #f2f2f2; font-size:15px; }
  .row:active { background:#eef4ff; }
  .row .name { flex:1; }
  .row .badge { font-size:12px; color:#888; background:#f0f0f0; border-radius:10px; padding:2px 8px; }
  .row .chev { color:#bbb; }
  .addr-row { flex-direction:column; align-items:stretch; gap:3px; }
  .addr-row .a { font-size:14px; color:#222; word-break:keep-all; }
  .addr-row .sub { font-size:12px; color:#777; }
  .back { padding:10px 14px; color:#1a73e8; font-weight:bold; cursor:pointer;
    border-bottom:1px solid #eee; font-size:14px; }
  .gps-btn {
    position:absolute; right:14px; bottom:70px; z-index:1000;
    width:52px; height:52px; border:none; border-radius:50%;
    background:#fff; box-shadow:0 3px 8px rgba(0,0,0,.35); font-size:24px; cursor:pointer;
  }
  .gps-btn:active { transform:scale(.94); }
  .addr-dot { width:12px; height:12px; background:#1a73e8; border:2px solid #fff;
    border-radius:50%; box-shadow:0 1px 2px rgba(0,0,0,.4); }
  .addr-dot.approx { background:#f39c12; }
  .legend { position:absolute; left:10px; bottom:80px; z-index:1000;
    background:rgba(255,255,255,.93); padding:6px 10px; border-radius:8px;
    box-shadow:0 2px 6px rgba(0,0,0,.3); font-size:12px; color:#333; }
  .dotb { display:inline-block; width:10px; height:10px; border-radius:50%; vertical-align:middle; margin-right:3px; }
  .my-dot { width:18px; height:18px; background:#e53935; border:3px solid #fff;
    border-radius:50%; box-shadow:0 0 6px rgba(229,57,53,.9); }
  .popup-addr { font-size:14px; font-weight:bold; margin-bottom:6px; word-break:keep-all; color:#111; }
  .popup-sub { font-size:12px; color:#666; margin-bottom:3px; }
  .nav-btn { display:block; text-align:center; margin-top:8px; background:#1a73e8; color:#fff;
    padding:8px 10px; border-radius:8px; text-decoration:none; font-weight:bold; font-size:14px; }
</style>
</head>
<body>
<div class="topbar">🗺️ 지역별 주소 지도 <span class="cnt" id="totalCnt"></span></div>
<div id="map"></div>
<div class="legend"><span class="dotb" style="background:#1a73e8"></span>정확/정밀 <b id="nReal">-</b>
  &nbsp; <span class="dotb" style="background:#f39c12"></span>대략(구) <b id="nApprox">-</b>
  <span id="geoStatus" style="display:block;color:#1a73e8;margin-top:2px"></span></div>
<button class="gps-btn" id="gpsBtn" title="내 위치">🎯</button>

<div id="panel">
  <div class="panel-handle" id="panelHandle"><span class="bar"></span>📋 지역 선택 (구 · 동 · 주소)</div>
  <div id="crumb"></div>
  <div id="list"></div>
</div>

<script src="./addresses.js"></script>
<script src="./config.js"></script>
<script>
var DATA = window.ADDR_DATA || {};
var map, cluster, myMarker = null, watchId = null;
var panel = document.getElementById('panel');
var listEl = document.getElementById('list');
var crumbEl = document.getElementById('crumb');
var sel = { sido:null, gugun:null, dong:null };

function esc(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function countGugun(g){ var n=0; for(var d in g) n+=g[d].length; return n; }
function countSido(s){ var n=0; for(var g in s) n+=countGugun(s[g]); return n; }
function totalCount(){ var n=0; for(var s in DATA) n+=countSido(DATA[s]); return n; }
function collectGugun(g){ var out=[]; for(var d in g) out=out.concat(g[d]); return out; }
function collectSido(s){ var out=[]; for(var g in s) out=out.concat(collectGugun(s[g])); return out; }

var dotIcon = L.divIcon({ className:'', html:'<div class="addr-dot"></div>', iconSize:[12,12], iconAnchor:[6,6] });
var dotApprox = L.divIcon({ className:'', html:'<div class="addr-dot approx"></div>', iconSize:[12,12], iconAnchor:[6,6] });
var redIcon = L.divIcon({ className:'', html:'<div class="my-dot"></div>', iconSize:[18,18], iconAnchor:[9,9] });

// ================= 브라우저 실시간 지오코딩(VWorld) =================
// 키가 있으면 구/동 선택 시 그 주소들을 VWorld로 조회해 '정확한 위치'로 점 이동.
// (py 실행 불필요 · JSONP로 CORS 우회 · 결과는 브라우저 localStorage에 저장)
var VWKEY = (window.VWORLD_KEY || '').trim();
var geoStatusEl = document.getElementById('geoStatus');
var geoCache = {};
try { geoCache = JSON.parse(localStorage.getItem('vw_geo') || '{}'); } catch(e){}
var geoSaveTimer = null;
function geoSave(){ clearTimeout(geoSaveTimer); geoSaveTimer=setTimeout(function(){
  try{ localStorage.setItem('vw_geo', JSON.stringify(geoCache)); }catch(e){} }, 1000); }

function cleanAddr(a){ return String(a).replace(/\(.*?\)/g,'').split(',')[0].replace(/\s+/g,' ').trim(); }

function jsonp(url){
  return new Promise(function(resolve,reject){
    var cb='vwcb_'+(jsonp._n=(jsonp._n||0)+1)+'_'+Math.floor(performance.now());
    var s=document.createElement('script');
    var to=setTimeout(function(){ done(); reject('timeout'); }, 8000);
    function done(){ clearTimeout(to); try{delete window[cb];}catch(e){} if(s.parentNode) s.parentNode.removeChild(s); }
    window[cb]=function(d){ done(); resolve(d); };
    s.onerror=function(){ done(); reject('neterr'); };
    s.src=url+'&callback='+cb; document.head.appendChild(s);
  });
}
function vwGeocode(addr){
  var key=cleanAddr(addr);
  if(geoCache[key]) return Promise.resolve(geoCache[key]);
  if(!VWKEY) return Promise.resolve(null);
  var base='https://api.vworld.kr/req/address?service=address&request=getcoord&version=2.0'
    +'&crs=epsg:4326&format=json&key='+encodeURIComponent(VWKEY)+'&address='+encodeURIComponent(key);
  function one(t){ return jsonp(base+'&type='+t).then(function(d){
    if(d&&d.response&&d.response.status==='OK'){ var p=d.response.result.point; return [parseFloat(p.y),parseFloat(p.x)]; }
    return null; }).catch(function(){ return null; }); }
  return one('ROAD').then(function(r){ return r || one('PARCEL'); })
    .then(function(r){ if(r){ geoCache[key]=r; geoSave(); } return r; });
}

// 마커 묶음을 동시 4개씩 조회해 정확 위치로 이동
function geocodeMarkers(markers){
  if(!VWKEY){ if(geoStatusEl) geoStatusEl.textContent='(정확위치: config.js에 VWorld 키 입력 시 작동)'; return; }
  var queue=markers.filter(function(m){ return m && !m._exact; });
  if(!queue.length){ if(geoStatusEl) geoStatusEl.textContent=''; return; }
  var i=0, active=0, done=0, CONC=4;
  function tick(){
    while(active<CONC && i<queue.length){
      var m=queue[i++]; active++;
      vwGeocode(m._d[2]).then(function(res){ active--; done++;
        if(res && this._d){ this.setLatLng(res); this.setIcon(dotIcon); this._exact=true; }
        if(geoStatusEl) geoStatusEl.textContent='정확 위치 조회 '+done+'/'+queue.length;
        tick();
      }.bind(m));
    }
    if(active===0 && i>=queue.length && geoStatusEl) geoStatusEl.textContent='정확 위치 완료 ('+queue.length+'건)';
  }
  tick();
}
function markersOf(s,g,d){ return allMarkers.filter(function(m){
  return m._s===s && (g==null||m._g===g) && (d==null||m._n===d); }); }

function initMap(){
  map = L.map('map', { zoomControl:true, preferCanvas:true }).setView([36.5,127.8], 7);
  // API 키가 필요 없는 구글 지도 타일
  L.tileLayer('https://mt{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
    subdomains:['0','1','2','3'], maxZoom:20, attribution:'&copy; Google Maps'
  }).addTo(map);

  cluster = L.markerClusterGroup({ chunkedLoading:true, chunkInterval:200, chunkDelay:20,
    maxClusterRadius:60, disableClusteringAtZoom:17, removeOutsideVisibleBounds:true });

  // 모든 마커를 미리 만들어 두고(시도/구/동 태그 부착), 선택 범위만 지도에 표시
  window.allMarkers = [];
  var nReal=0, nApprox=0;
  for(var sido in DATA) for(var gugun in DATA[sido]) for(var dong in DATA[sido][gugun]){
    var arr = DATA[sido][gugun][dong];
    for(var i=0;i<arr.length;i++){
      var p = arr[i];
      if(p[0]==null) continue;
      var real = p[4] ? true : false;
      var cached = geoCache[cleanAddr(p[2])];        // 이전에 조회해둔 정확 좌표
      var lat = cached ? cached[0] : p[0];
      var lng = cached ? cached[1] : p[1];
      var exact = cached ? true : false;
      if(real || exact) nReal++; else nApprox++;
      var m = L.marker([lat,lng], {icon: (real||exact) ? dotIcon : dotApprox});
      m._d = p; m._s = sido; m._g = gugun; m._n = dong; m._exact = exact;
      m.on('click', function(e){ openPopup(e.target, e.target._d); });
      allMarkers.push(m);
    }
  }
  map.addLayer(cluster);
  showMarkers(null);   // 처음엔 전체 표시

  document.getElementById('totalCnt').textContent = totalCount().toLocaleString() + '건';
  document.getElementById('nReal').textContent = nReal.toLocaleString();
  document.getElementById('nApprox').textContent = nApprox.toLocaleString();
  renderSido();
}

// 선택 범위(filter)에 맞는 마커만 지도에 표시. filter=null 이면 전체.
function showMarkers(filter){
  cluster.clearLayers();
  var subset = filter ? allMarkers.filter(filter) : allMarkers;
  cluster.addLayers(subset);
}

function openPopup(marker, rec){
  var q = encodeURIComponent(rec[2]);
  var search = 'https://www.google.com/maps/search/?api=1&query=' + q;   // 구글지도 검색(연동)
  var nav = 'https://www.google.com/maps/dir/?api=1&destination=' + q;   // 길안내
  var cnt = rec[3] || 1;
  var html = '<div class="popup-addr">' + esc(rec[2]) + '</div>' +
    (cnt > 1 ? '<div class="popup-sub" style="color:#d93025;font-weight:bold">🏬 이 주소 사업장 ' + cnt + '개</div>' : '') +
    '<a class="nav-btn" href="' + search + '" target="_blank" rel="noopener">🔍 구글지도에서 열기</a>' +
    '<a class="nav-btn" style="background:#34a853;margin-top:6px" href="' + nav + '" target="_blank" rel="noopener">🚗 구글 길안내</a>';
  marker.bindPopup(html, {maxWidth:260}).openPopup();
}

function fitToRecords(records){
  var pts = records.filter(function(p){ return p[0]!=null; }).map(function(p){ return [p[0],p[1]]; });
  if(!pts.length) return;
  if(pts.length===1){ map.setView(pts[0], 16); }
  else { map.fitBounds(L.latLngBounds(pts), {padding:[40,40]}); }
}

// ── 드릴다운 ──
function setCrumb(){
  var h='<b onclick="renderSido()">전체</b>';
  if(sel.sido) h+='<span class="sep">›</span><b onclick="renderGugun()">'+esc(sel.sido)+'</b>';
  if(sel.gugun) h+='<span class="sep">›</span><b onclick="renderDong()">'+esc(sel.gugun)+'</b>';
  if(sel.dong) h+='<span class="sep">›</span><b>'+esc(sel.dong)+'</b>';
  crumbEl.innerHTML=h;
}
function clearList(){ listEl.innerHTML=''; }
function addBack(fn){ var b=document.createElement('div'); b.className='back'; b.textContent='‹ 뒤로'; b.onclick=fn; listEl.appendChild(b); }
function navRow(label, count, onClick){
  var r=document.createElement('div'); r.className='row';
  r.innerHTML='<span class="name">'+esc(label)+'</span><span class="badge">'+count.toLocaleString()+'</span><span class="chev">›</span>';
  r.onclick=onClick; listEl.appendChild(r);
}
function renderSido(){
  sel={sido:null,gugun:null,dong:null}; setCrumb(); clearList();
  showMarkers(null);   // 전체 표시
  Object.keys(DATA).sort().forEach(function(s){ navRow(s, countSido(DATA[s]), function(){ sel.sido=s; renderGugun(); }); });
  panel.classList.add('open');
}
function renderGugun(){
  sel.gugun=null; sel.dong=null; setCrumb(); clearList(); addBack(renderSido);
  var s=sel.sido;
  showMarkers(function(m){ return m._s===s; });          // 이 시도만 점으로
  fitToRecords(collectSido(DATA[s]));
  var g=DATA[s];
  Object.keys(g).sort().forEach(function(k){ navRow(k, countGugun(g[k]), function(){ sel.gugun=k; renderDong(); }); });
}
function renderDong(){
  sel.dong=null; setCrumb(); clearList(); addBack(renderGugun);
  var s=sel.sido, gg=sel.gugun;
  showMarkers(function(m){ return m._s===s && m._g===gg; });   // 이 구만 점으로
  fitToRecords(collectGugun(DATA[s][gg]));
  var g=DATA[s][gg];
  Object.keys(g).sort().forEach(function(k){ navRow(k, g[k].length, function(){ sel.dong=k; renderAddr(); }); });
}
function renderAddr(){
  setCrumb(); clearList(); addBack(renderDong);
  var s=sel.sido, gg=sel.gugun, dd=sel.dong;
  var arr=DATA[s][gg][dd];
  showMarkers(function(m){ return m._s===s && m._g===gg && m._n===dd; });  // 이 동만 점으로
  // 좌표는 이미 미리 넣어둠(카카오+gimi9) → 브라우저 실시간 조회는 사용 안 함
  // geocodeMarkers(markersOf(s, gg, dd));
  arr.forEach(function(p){
    var r=document.createElement('div'); r.className='row addr-row';
    var sub=[];
    if((p[3]||1)>1) sub.push('🏬 사업장 '+p[3]+'개');
    r.innerHTML='<div class="a">'+esc(p[2])+'</div>'+(sub.length?'<div class="sub">'+sub.join('&nbsp;&nbsp;')+'</div>':'');
    r.onclick=function(){
      if(p[0]==null){ alert('이 주소는 좌표가 없습니다.'); return; }
      map.setView([p[0],p[1]], 17);
      var tmp=L.marker([p[0],p[1]], {icon:dotIcon}).addTo(map);
      openPopup(tmp, p);
      tmp.on('popupclose', function(){ map.removeLayer(tmp); });
      panel.classList.remove('open');
    };
    listEl.appendChild(r);
  });
  fitToRecords(arr);
}

// ── 패널 · GPS ──
document.getElementById('panelHandle').onclick=function(){ panel.classList.toggle('open'); };
document.getElementById('gpsBtn').addEventListener('click', function(){
  if(!navigator.geolocation){ alert('위치 기능을 지원하지 않습니다.'); return; }
  if(watchId!==null){ navigator.geolocation.clearWatch(watchId); }
  var btn=this; btn.textContent='⏳';
  watchId=navigator.geolocation.watchPosition(function(pos){
    btn.textContent='🎯';
    var ll=[pos.coords.latitude, pos.coords.longitude];
    if(myMarker){ myMarker.setLatLng(ll); }
    else { myMarker=L.marker(ll, {icon:redIcon, zIndexOffset:1000}).addTo(map).bindPopup('📍 현재 내 위치'); }
    map.setView(ll, 16);
  }, function(err){ btn.textContent='🎯'; alert('위치를 가져올 수 없습니다: '+err.message); },
  { enableHighAccuracy:true, maximumAge:5000, timeout:10000 });
});

initMap();
</script>
</body>
</html>
