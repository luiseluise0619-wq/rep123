<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>방문 사진 관리</title>
<style>
:root{color-scheme:light;--ink:#111827;--mut:#606975;--line:#e5e7eb;--soft:#f5f6f8;--accent:#2563eb}
*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font:15px/1.5 system-ui,'Malgun Gothic',sans-serif}
main{max-width:1100px;margin:auto;padding:22px 18px 60px}header,.top,.actions,.toolbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
header{margin-bottom:26px}h1{font-size:25px;margin:0;letter-spacing:-.04em}h2{font-size:18px;margin:0}p{margin:8px 0}.small{font-size:13px;color:var(--mut)}a{color:var(--mut);text-underline-offset:3px}
.card{border:1px solid var(--line);border-radius:12px;padding:18px;margin:16px 0}.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.metric{background:var(--soft);border-radius:10px;padding:14px;color:var(--mut)}.metric b{display:block;color:var(--ink);font-size:30px;font-variant-numeric:tabular-nums}
button{min-height:44px;border:1px solid transparent;border-radius:9px;padding:9px 14px;font:inherit;font-weight:600;background:var(--accent);color:white;cursor:pointer}.secondary{background:#fff;color:var(--ink);border-color:#d1d5db}.danger{background:#fff;color:#b42318;border-color:#f2c9c5}button:disabled{opacity:.5;cursor:not-allowed}
input,select{min-height:44px;border:1px solid #d1d5db;border-radius:9px;padding:9px 12px;font:inherit;width:100%}label{font-size:13px;display:block;margin-bottom:6px}.search{display:grid;grid-template-columns:minmax(0,2fr) minmax(130px,1fr);gap:10px;margin:18px 0}
#loginCard{max-width:420px;margin:44px auto}#loginCard input{margin-bottom:12px}#loginCard button{width:100%}.message{padding:12px;background:var(--soft);border-radius:9px;white-space:pre-line;margin:12px 0}.message.error{background:#fff1f0;color:#9f241b;border:1px solid #f2c9c5}
.notice{padding:12px;background:#fff7ed;color:#854b0d;border:1px solid #f1ddbf;border-radius:9px}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;margin-top:14px;text-align:left}th,td{border-bottom:1px solid var(--line);padding:12px;vertical-align:top}th{background:var(--soft);color:var(--mut);font-weight:500;font-size:13px}td{font-size:14px}.address{font-weight:600;min-width:240px;max-width:520px;overflow-wrap:anywhere}.region{font-size:12px;color:var(--mut);font-weight:400}.photo-actions{display:flex;gap:6px;flex-wrap:wrap}.photo-actions button{background:#fff;border-color:#d1d5db;color:var(--accent);font-size:13px}
.pager{margin-top:16px}.empty{padding:32px;text-align:center;color:var(--mut)}dialog{width:min(900px,95vw);max-height:95dvh;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:16px;color:var(--ink)}dialog::backdrop{background:#111827a6}dialog img{display:block;max-width:100%;max-height:66dvh;object-fit:contain;margin:12px auto}#caption{white-space:pre-line;font-size:13px;color:var(--mut)}
[hidden]{display:none!important}:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
@media(max-width:650px){main{padding:18px 14px 40px}.search{grid-template-columns:1fr}table,tbody,tr,td{display:block}thead{position:absolute;clip-path:inset(50%)}tr{border:1px solid var(--line);border-radius:10px;margin:10px 0;padding:8px}td{border:0;padding:5px 8px}.address{min-width:0;max-width:none}.metrics b{font-size:25px}}
</style></head><body><main>
<header><h1>방문 사진 관리</h1><nav class="actions"><a href="/">지도</a><a href="https://mybox.naver.com/" target="_blank" rel="noopener noreferrer">MYBOX ↗</a></nav></header>
<div id="message" class="message" role="status" aria-live="polite" hidden></div>
<section id="loginCard" class="card"><h2>관리자 로그인</h2><p class="small">사진과 주소별 등록 수를 확인합니다.</p><form id="loginForm"><label for="password">관리자 비밀번호</label><input id="password" type="password" autocomplete="current-password" required><button id="login" type="submit">로그인</button></form></section>
<section id="workspace" hidden>
<div class="top"><p id="updated" class="small">등록 현황을 불러오는 중…</p><div class="actions"><button id="refresh" type="button">새로고침</button><button id="export" type="button" class="secondary">CSV 내려받기</button><button id="logout" type="button" class="secondary">로그아웃</button></div></div>
<div class="metrics"><div class="metric">사진 등록 주소<b id="addressCount">—</b></div><div class="metric">등록 사진<b id="photoCount">—</b></div></div>
<p id="pending" class="notice" hidden></p>
<div class="search"><div><label for="query">주소 검색</label><input id="query" type="search" placeholder="주소나 동 이름 입력"></div><div><label for="status">사진 수</label><select id="status"><option value="">전체</option><option value="1">1장</option><option value="2">2장</option></select></div></div>
<p id="progress" class="small" role="status"></p><div id="results" class="scroll"></div>
<div class="actions pager"><button id="prev" class="secondary" type="button">이전</button><span id="page" class="small"></span><button id="next" class="secondary" type="button">다음</button></div>
<details><summary>집계 안내</summary><p class="small">관리자 새로고침은 등록·삭제 후 목록 반영이 밀린 주소를 먼저 확인합니다. 저장 공간과 MYBOX 서비스 한도는 별도로 적용됩니다. 사진 삭제는 MYBOX 휴지통으로 이동합니다.</p></details>
</section></main>
<dialog id="photoDialog" aria-label="방문 사진"><div class="actions"><button id="closePhoto" class="secondary" type="button">닫기</button><button id="deletePhoto" class="danger" type="button">사진 삭제</button></div><div id="confirm" class="notice" hidden><p>이 사진을 MYBOX 휴지통으로 이동할까요?</p><div class="actions"><button id="cancelDelete" class="secondary" type="button">취소</button><button id="confirmDelete" class="danger" type="button">삭제</button></div></div><p id="caption"></p><img id="fullPhoto" alt="선택한 방문 사진"></dialog>
<script>
(function(){'use strict';
const $=id=>document.getElementById(id);let session=sessionStorage.getItem('photoDirectAdminSession')||'',rows=[],overview=null,page=0,busy=false,selected=null;
function say(message,isError=false){$('message').textContent=message;$('message').hidden=!message;$('message').classList.toggle('error',isError);}
async function api(action,fields={}){let response;try{response=await fetch('/api/photo-direct',{method:'POST',cache:'no-store',referrerPolicy:'no-referrer',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,...fields}),signal:AbortSignal.timeout(90000)});}catch{throw Error('연결이 늦습니다. 잠시 후 다시 시도해 주세요.');}
  const value=await response.json();if(!response.ok||!value.ok){const e=Error(value.message||'요청에 실패했습니다.');e.code=value.code;throw e;}return value.data;}
function setBusy(value){busy=value;['refresh','export','logout','prev','next'].forEach(id=>{$(id).disabled=value;});}
function logout(){session='';sessionStorage.removeItem('photoDirectAdminSession');rows=[];overview=null;selected=null;$('workspace').hidden=true;$('loginCard').hidden=false;$('results').replaceChildren();$('fullPhoto').removeAttribute('src');}
function filtered(){const q=$('query').value.trim().toLowerCase(),status=$('status').value;return rows.filter(row=>(!q||(row.address+' '+row.province+' '+row.district+' '+row.dong).toLowerCase().includes(q))&&(!status||row.photos.length===Number(status))).sort((a,b)=>a.address.localeCompare(b.address,'ko'));}
function fmt(value){return value&&Number.isFinite(Date.parse(value))?new Date(value).toLocaleString('ko-KR',{timeZone:'Asia/Seoul'}):'기록 없음';}
async function openPhoto(row,photo){if(busy)return;setBusy(true);say('사진을 불러오는 중…');try{const data=await api('photo',{address:row.address,photoId:photo.id});selected={address:row.address,id:photo.id};$('caption').textContent='방문 주소: '+row.address+'\n등록 시각: '+fmt(photo.uploadedAt)+'\n촬영 시각(기기): '+fmt(photo.evidence?.capturedAt);$('fullPhoto').src='data:image/jpeg;base64,'+data.base64;$('confirm').hidden=true;$('photoDialog').showModal();say('');}catch(e){say(e.message,true);}finally{setBusy(false);}}
function render(){const matches=filtered(),pages=Math.max(1,Math.ceil(matches.length/50));page=Math.min(page,pages-1);$('results').replaceChildren();
  if(!matches.length){const empty=document.createElement('p');empty.className='empty';empty.textContent=rows.length?'검색 결과가 없습니다.':'등록된 사진이 없습니다.';$('results').append(empty);}
  else{const table=document.createElement('table'),head=document.createElement('thead'),tr=document.createElement('tr');['지역·방문 주소','사진 수','최근 등록','사진'].forEach(label=>{const th=document.createElement('th');th.textContent=label;tr.append(th);});head.append(tr);table.append(head);const body=document.createElement('tbody');
    matches.slice(page*50,(page+1)*50).forEach(row=>{const tr=document.createElement('tr'),address=document.createElement('td'),count=document.createElement('td'),time=document.createElement('td'),photos=document.createElement('td'),region=document.createElement('div');address.className='address';region.className='region';region.textContent=[row.province,row.district,row.dong].filter(Boolean).join(' / ');address.append(region,document.createTextNode(row.address));count.textContent=row.photos.length+' / 2장';time.textContent=fmt(row.photos.map(p=>p.uploadedAt).filter(Boolean).sort().at(-1));photos.className='photo-actions';row.photos.forEach(photo=>{const button=document.createElement('button');button.type='button';button.textContent='사진 '+photo.slot+' 보기';button.onclick=()=>openPhoto(row,photo);photos.append(button);});tr.append(address,count,time,photos);body.append(tr);});table.append(body);$('results').append(table);}
  $('page').textContent=(page+1)+' / '+pages+' 페이지 · '+matches.length+'곳';$('prev').disabled=busy||page===0;$('next').disabled=busy||page>=pages-1;}
async function refresh(){if(busy||!session)return;setBusy(true);say('사진 목록을 확인하는 중…');try{
  let data=await api('adminOverview',{adminSession:session});
  for(let i=0;i<10&&data.pending;i++){const fixed=await api('repairPending',{adminSession:session});$('progress').textContent='집계 반영 대기 '+fixed.remaining+'곳';if(!fixed.processed||fixed.remaining>=data.pending)break;data=await api('adminOverview',{adminSession:session});}
  overview=data;$('addressCount').textContent=data.addresses.toLocaleString();$('photoCount').textContent=data.photos.toLocaleString();$('updated').textContent='최근 반영 '+fmt(data.updatedAt);$('pending').hidden=!data.pending;$('pending').textContent=data.pending+'개 주소의 목록 반영이 남아 있습니다. 새로고침으로 다시 확인하세요.';
  const keys=data.chunks||[],results=Array(keys.length);let next=0;
  await Promise.all(Array.from({length:Math.min(4,keys.length)},async()=>{while(next<keys.length){const i=next++;const chunk=await api('adminChunk',{adminSession:session,key:keys[i]});results[i]=chunk.rows;$('progress').textContent=(i+1)+' / '+keys.length+' 묶음 확인 중…';}}));
  rows=results.flat();page=0;render();$('progress').textContent='사진 등록 주소 '+rows.length+'곳 · '+fmt(data.updatedAt)+' 기준';say('');
 }catch(e){if(e.code==='TICKET'||e.code==='EXPIRED'||e.code==='FORBIDDEN')logout();say(e.message,true);}finally{setBusy(false);render();}}
$('loginForm').onsubmit=async event=>{event.preventDefault();if(busy)return;setBusy(true);say('로그인 중…');try{const data=await api('adminLogin',{password:$('password').value});$('password').value='';session=data.session;sessionStorage.setItem('photoDirectAdminSession',session);$('loginCard').hidden=true;$('workspace').hidden=false;say('');}catch(e){say(e.message,true);}finally{setBusy(false);}if(session)await refresh();};
$('refresh').onclick=refresh;$('logout').onclick=logout;$('query').oninput=()=>{page=0;render();};$('status').onchange=()=>{page=0;render();};$('prev').onclick=()=>{page--;render();};$('next').onclick=()=>{page++;render();};
$('closePhoto').onclick=()=>{$('photoDialog').close();$('fullPhoto').removeAttribute('src');selected=null;};$('deletePhoto').onclick=()=>{if(selected)$('confirm').hidden=false;};$('cancelDelete').onclick=()=>{$('confirm').hidden=true;};
$('confirmDelete').onclick=async()=>{if(!selected||busy)return;setBusy(true);try{await api('remove',{adminSession:session,address:selected.address,photoId:selected.id});$('photoDialog').close();$('fullPhoto').removeAttribute('src');selected=null;say('사진을 MYBOX 휴지통으로 이동했습니다.');}catch(e){say(e.message,true);}finally{setBusy(false);}await refresh();};
function csvCell(value){let text=String(value==null?'':value);if(/^[=+@\-\t\r]/.test(text))text="'"+text;return '"'+text.replace(/"/g,'""')+'"';}
$('export').onclick=()=>{const values=[['시도','구군','읍면동','원주소','사진 수','등록 시각','촬영 시각']];filtered().forEach(row=>row.photos.forEach(photo=>values.push([row.province,row.district,row.dong,row.address,row.photos.length,photo.uploadedAt||'',photo.evidence?.capturedAt||''])));const blob=new Blob(['\uFEFF'+values.map(row=>row.map(csvCell).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='방문사진_목록.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
if(session){$('loginCard').hidden=true;$('workspace').hidden=false;refresh();}
})();
</script></body></html>
